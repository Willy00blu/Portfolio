<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0d0d0f" />
  <meta name="color-scheme" content="dark" />
  <title>Page not found — Guglielmo Rotunno</title>

  <!--
    Deliberately self-contained: an error page can be served from any path
    depth, so it carries its own styles instead of relying on relative or
    root-absolute links that break when the repo (and therefore the Pages
    base path) is renamed.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root { --bg:#0d0d0f; --text:#fff; --muted:#a1a1aa; --accent:#856de5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--bg) radial-gradient(circle at top right, rgba(133,109,229,.15), transparent 40%);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }
    .code {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: clamp(4rem, 18vw, 8rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #fff 40%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      margin: 1rem 0 .75rem;
    }
    p { color: var(--muted); margin-bottom: 2rem; }
    a.home {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      min-height: 44px;
      padding: .75rem 2rem;
      border-radius: 50px;
      background: var(--accent);
      border: 2px solid var(--accent);
      color: #fff;
      font-family: 'Outfit', system-ui, sans-serif;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(133,109,229,.3);
      transition: transform .25s cubic-bezier(.16,1,.3,1), background .25s;
    }
    @media (hover: hover) {
      a.home:hover { background: #9b7bff; transform: translateY(-3px); }
    }
    a.home:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page took a wrong turn</h1>
    <p>The link may be outdated, or the page may have been renamed.</p>
    <a class="home" id="home-link" href="/">Back to the portfolio</a>
  </main>

  <script>
    /* Point "home" at the site root, whatever base path Pages is serving
       from (/Portfolio/ today, "/" on a user site or a custom domain). */
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var base = parts.length > 1 ? '/' + parts[0] + '/' : '/';
      document.getElementById('home-link').setAttribute('href', base);
    })();
  </script>
</body>
</html>
